  <body>
    <h1>Calculator</h1>
    <div id="calculator-container">
      <div id="display"></div>
      <div id="buttons-container">
        <div id="leftBtn-container">
          <div id="first-row">
            <button class="clear-btn" id="allClearBtn">AC</button>
            <button class="clear-btn" id="delBtn">⌫</button>
          </div>
          <div id="second-row">
            <button class="digit-btn" id="7Btn" value="7">7</button>
            <button class="digit-btn" id="8Btn" value="8">8</button>
            <button class="digit-btn" id="9Btn" value="9">9</button>
          </div>
          <div id="third-row">
            <button class="digit-btn" id="4Btn" value="4">4</button>
            <button class="digit-btn" id="5Btn" value="5">5</button>
            <button class="digit-btn" id="6Btn" value="6">6</button>
          </div>
          <div id="fourth-row">
            <button class="digit-btn" id="1Btn" value="1">1</button>
            <button class="digit-btn" id="2Btn" value="2">2</button>
            <button class="digit-btn" id="3Btn" value="3">3</button>
          </div>
          <div id="fifth-row">
            <button class="digit-btn" id="0Btn" value="0">0</button>
            <button class="digit-btn" id="decBtn" value=".">.</button>
          </div>
        </div>
        <div id="rightBtn-container">
          <button class="operator-btn" id="divideBtn" value="/">÷</button>
          <button class="operator-btn" id="multiplyBtn" value="*">×</button>
          <button class="operator-btn" id="subtractBtn" value="-">-</button>
          <button class="operator-btn" id="addBtn" value="+">+</button>
          <button id="equalBtn" value="=">=</button>
        </div>
      </div>
    </div>
    <div class="explanation-text">This calculator has keyboard support!</div>
