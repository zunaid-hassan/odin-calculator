<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="style.css" rel="stylesheet" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap");
    </style>

    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Calculator</h1>
    <div id="calculator-container">
      <div id="display"></div>
      <div id="buttons-container">
        <div id="operationBtn-container">
          <button id="addBtn" value="+">+</button>
          <button id="subtractBtn" value="-">-</button>
          <button id="multiplyBtn" value="*">×</button>
          <button id="divideBtn" value="/">÷</button>
          <button id="equalBtn" value="=">=</button>
          <button id="allClearBtn">AC</button>
          <button id="delBtn">⌫</button>
        </div>

        <div id="numpad-container">
          <button id="1Btn" value="1">1</button>
          <button id="2Btn" value="2">2</button>
          <button id="3Btn" value="3">3</button>
          <button id="4Btn" value="4">4</button>
          <button id="5Btn" value="5">5</button>
          <button id="6Btn" value="6">6</button>
          <button id="7Btn" value="7">7</button>
          <button id="8Btn" value="8">8</button>
          <button id="9Btn" value="9">9</button>
          <button id="0Btn" value="0">0</button>
          <button id="decBtn" value=".">.</button>
        </div>
      </div>
    </div>
    <footer>The Odin Project 2026</footer>
  </body>
</html>
